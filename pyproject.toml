[tool.ruff]
# Python 3.13 target
target-version = "py313"

# Line length
line-length = 100

# Exclude directories
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".pixi",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable linting rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "I",      # isort
]

# Ignore specific rules
ignore = [
    "E501",   # line too long (handled by formatter)
    "E741",   # ambiguous variable name
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
    "SIM108", # use ternary operator
    "E722",   # bare except
    "E731",   # lambda assignment
    "F403",   # star imports
    "F405",   # undefined from star imports
    "UP031",  # Use format specifiers (keep % formatting for now)
    "UP032",  # Use f-strings (keep % formatting for now)
]

[tool.ruff.lint.per-file-ignores]
# Ignore unused imports in __init__ files
"__init__.py" = ["F401"]
# Ignore star imports in tests
"test_*.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
# Combine multiple imports from same module
combine-as-imports = true