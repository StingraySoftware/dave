apiVersion: v1
kind: ConfigMap
metadata:
  name: dave-config
  namespace: dave
data:
  SERVER_PORT: "5000"
  FLASK_ENV: "production"
  LOG_LEVEL: "INFO"
  MAX_UPLOAD_SIZE: "100"  # MB
  SESSION_TIMEOUT: "3600"  # seconds
  ENABLE_CORS: "true"
  CORS_ORIGINS: "*"
  # Scientific computation settings
  MAX_THREADS: "4"
  MEMORY_LIMIT: "4096"  # MB
  CACHE_SIZE: "100"  # Number of datasets to cache